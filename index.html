<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>本めぐり</title>
<meta name="description" content="本屋をめぐって、本とめぐりあう。本屋と図書館の位置ゲーム。その場所だけのスタンプを押し、歩いた道のりと本との出会い、読んだ時間が物語のページになる。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF8EA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="本めぐり">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://tiles.openfreemap.org https://api.openbd.jp https://ndlsearch.ndl.go.jp https://tsunagubooks.com http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; child-src blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" href="icon-192.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<link rel="stylesheet" href="css/app.css?v=0.21.0">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-foot" viewBox="0 0 24 24"><path d="M8 3c2 0 3 2 3 5s-1 5-3 6-3.5-1-3.5-4S6 3 8 3zm-2 13.5c1.5-.5 3-.5 4 .5l-.5 3c-.3 1-1 1.5-2 1.5s-1.8-.6-1.8-1.6zM16 5c2 0 3.5 2.5 3.5 5.5S18 15 16 16s-3-2-3-5 1-6 3-6zm-2 13c1.5-.5 3-.5 4 .5l-.5 3c-.3 1-1 1.5-2 1.5s-1.8-.6-1.8-1.6z" fill="currentColor"/></symbol>
  <symbol id="i-warp" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-barcode" viewBox="0 0 24 24"><path d="M3 5v14M7 5v14M10 5v14M13 5v14M17 5v14M21 5v14M15 5v14" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 12 18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 0h12l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 20 4-1L19 8l-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-7.5 7-13a7 7 0 1 0-14 0c0 5.5 7 13 7 13z" fill="currentColor"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></symbol>
  <symbol id="i-stamp" viewBox="0 0 24 24"><path d="M9 3h6v6l3 3v2H6v-2l3-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 19h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-9.5A4 4 0 0 1 12 9a4 4 0 0 1 7 2.5C19 16.6 12 21 12 21z" fill="currentColor"/></symbol>
  <symbol id="i-seal" viewBox="0 0 100 100"><path d="M50 95C50 95 18 62 18 38a32 32 0 0 1 64 0c0 24-32 57-32 57z" fill="currentColor"/><circle cx="50" cy="38" r="17" fill="#fff"/><path d="M48.9 33.5Q44.3 29.3 39.3 31V44.8Q44.3 43 48.9 46.8zM51.1 33.5Q55.7 29.3 60.7 31V44.8Q55.7 43 51.1 46.8z" fill="currentColor"/></symbol>
</svg>

<header id="top">
  <div class="brand"><svg class="seal" aria-hidden="true"><use href="#i-seal"></use></svg><div><div id="brand-title" class="brand-name"></div><div class="brand-sub">本めぐり</div></div></div>
  <div class="hud">
    <button id="lv-btn" class="lv" aria-label="巻（物語の進み）"><span id="lv-label">第1巻</span><i class="xpbar"><b id="xp-fill"></b></i></button>
    <button id="btn-settings" class="icon-btn" aria-label="設定"><svg class="ic"><use href="#i-gear"></use></svg></button>
  </div>
</header>

<main id="main">
  <section id="view-map" class="view active" aria-label="地図">
    <div id="map"></div>
    <div id="search-box"><svg class="ic sicon"><use href="#i-search"></use></svg><input id="search" type="search" placeholder="店の名前や住所でさがす" autocomplete="off" aria-label="店をさがす"><div id="search-results" class="dropdown" hidden></div></div>
    <div class="map-ctl">
      <button id="btn-locate" class="fab" title="現在地を追う" aria-label="現在地を追う"><svg class="ic"><use href="#i-locate"></use></svg></button>
      <button id="btn-trial" class="fab" title="お試し歩き" aria-label="お試し歩き" hidden><svg class="ic"><use href="#i-foot"></use></svg></button>
      <button id="btn-warp" class="fab" title="本屋の近くへワープ" aria-label="本屋の近くへワープ" hidden><svg class="ic"><use href="#i-warp"></use></svg></button>
      <button id="btn-add" class="fab" title="地図にない本屋を知らせる" aria-label="地図にない本屋を知らせる"><svg class="ic"><use href="#i-add"></use></svg></button>
    </div>
    <div id="trial-banner" class="pill-banner" hidden><svg class="ic"><use href="#i-foot"></use></svg>お試し歩き中（地図を押すと、そこへ移動）</div>
    <div id="bottom-dock">
      <div id="want-alert" hidden></div>
      <div class="dock-row"><button id="event-chip" class="ticket ev" hidden aria-label="開催中のイベント"></button><button id="area-chip" class="area-chip" hidden></button><button id="mission-chip" class="ticket" hidden aria-label="きょうのお題"></button></div>
      <div id="radar-items" class="chips"></div>
      <div id="read-btn" class="read-btn" hidden></div>
    </div>
  </section>

  <section id="view-radar" class="view" aria-label="ちかく">
    <div class="pane">
      <h2>ちかく</h2>
      <div id="radar-legend" class="legend"></div>
      <div id="radar-picks"></div>
      <div id="radar-status" class="status-card"></div>
      <div id="radar-list" class="list"></div>
      <div id="radar-wants"></div>
    </div>
  </section>

  <section id="view-zukan" class="view" aria-label="めぐり帳">
    <div class="pane">
      <div class="profile" id="profile"></div>
      <div class="segmented" role="tablist">
        <button data-sub="stamps" class="active" role="tab">スタンプ</button><button data-sub="cards" role="tab">本</button><button data-sub="log" role="tab">物語</button><button data-sub="month" role="tab">月</button><button data-sub="prefs" role="tab">県</button>
      </div>
      <div id="sub-stamps" class="sub active"><div id="stamp-grid" class="stamp-grid"></div></div>
      <div id="sub-cards" class="sub"><div id="reading"></div><p class="hint">「この店で、この本と出会った」の記録。読んだかどうかは問いません。</p><div id="card-grid" class="card-grid"></div></div>
      <div id="sub-log" class="sub"><div id="story-today"></div><h3>前の章</h3><div id="chapters"></div><h3>○年前の今日</h3><div id="anniv" class="status-card"></div><h3>行った店</h3><div id="visit-list" class="list"></div></div>
      <div id="sub-month" class="sub"><div id="month"></div></div>
      <div id="sub-prefs" class="sub"><p class="hint">スタンプを押した県が塗られます（住所の情報がない店は近い県に寄せた目安）。</p><div id="prefs" class="prefs"></div></div>
    </div>
  </section>

  <section id="view-mission" class="view" aria-label="ラリー">
    <div class="pane">
      <div id="event-list" hidden></div>
      <h3>今日のお題 <span class="muted" id="day-label"></span></h3>
      <div id="daily-list" class="mlist"></div>
      <h3>今週のお題 <span class="muted" id="week-label"></span></h3>
      <div id="mission-list" class="mlist"></div>
      <h3>今週の推し店 <span class="muted">県ごとに1店・+500</span></h3>
      <div id="feat-list" class="list"></div>
      <h3>ご当地ラリー</h3>
      <div id="rally-list" class="mlist"></div>
      <h3>実績</h3>
      <div id="ach-list" class="mlist"></div>
    </div>
  </section>

  <section id="view-settings" class="view" aria-label="設定">
    <div class="pane" id="settings-pane"></div>
  </section>
</main>

<nav id="tabs" aria-label="画面の切り替え">
  <button data-view="map" class="active"><svg class="ic"><use href="#i-map"></use></svg><span>地図</span></button>
  <button data-view="radar"><svg class="ic"><use href="#i-radar"></use></svg><span>ちかく</span></button>
  <button data-view="zukan"><svg class="ic"><use href="#i-book"></use></svg><span>めぐり帳</span></button>
  <button data-view="mission"><svg class="ic"><use href="#i-flag"></use></svg><span>ラリー</span></button>
</nav>

<div id="sheet" class="sheet" hidden role="dialog" aria-label="店"><div class="handle"></div><button class="icon-btn close" id="sheet-close" aria-label="閉じる"><svg class="ic"><use href="#i-close"></use></svg></button><div id="sheet-body"></div></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>
<div id="capture" class="capture" hidden role="dialog" aria-modal="true"><div class="capture-box" id="capture-box"></div></div>
<div id="onboard" class="onboard" hidden role="dialog" aria-modal="true"><div class="onboard-box" id="onboard-box"></div></div>
<div id="banners"><div id="offline" class="banner" hidden><svg class="ic"><use href="#i-alert"></use></svg>ネットにつながっていません。地図と本の情報は後で読み込みます</div><div id="update" class="banner action" hidden><svg class="ic"><use href="#i-refresh"></use></svg>新しい版があります<button id="btn-update">更新</button></div></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script type="module" src="js/main.js?v=0.21.0"></script>
</body>
</html>
